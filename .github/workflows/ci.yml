name: Office of Equity Open Notebook CI & Release Gates

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master, release/* ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lane 1 - Fast Lane (TypeCheck & Unit Tests)
        run: |
          npm run build:types
          node scripts/tests/test-service-contracts.js
          node scripts/tests/test-readiness.js
          node scripts/tests/test-credentials.js

      - name: Lane 2 - Integration Lane (API Proxy & Loopback Audit)
        run: |
          node scripts/tests/test-native-host-proxy.js
          node scripts/tests/test-loopback-audit.js
          node scripts/tests/test-process-management.js

      - name: Lane 3 - Stress & Chaos Lane (Port Conflicts & Resilience)
        run: |
          node scripts/tests/test-port-conflict.js
          node scripts/tests/test-compatibility-harness.js

      - name: Lane 4 - RAG & Golden Extraction Regression Lane
        run: |
          node scripts/tests/test-golden-regression.js
          node scripts/tests/test-no-docling-runtime.js

      - name: Lane 5 - Packaging & Clean Machine Installer Lane
        run: |
          node scripts/tests/test-modular-packaging.js
          node scripts/tests/test-installer-experiments.js
          node scripts/tests/test-clean-machine-validation.js

      - name: Lane 6 - Performance & Worker Concurrency Lane
        run: |
          node scripts/tests/test-performance-harness.js
          node scripts/tests/test-worker-concurrency.js
          node scripts/tests/test-reprofile-app.js

      - name: Run Master Mechanical Verifier
        run: node scripts/orchestrator/verifier.js

  build-installer:
    needs: ci-pipeline
    # The runtime-evidence gate in scripts/lib/runtime-evidence.js intentionally
    # rejects packaging while the frontend is a POC (F05 open). Until F05
    # delivers a functional frontend, the Prepare Runtime step reports that one
    # known failure. The step tolerates ONLY the documented gate message and
    # still fails on any other error; the summary step re-checks state so an
    # unexpected failure cannot hide behind this. Remove this tolerance once
    # the gate can pass.
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Rust (Tauri Dependency)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Verify Toolchain
        shell: pwsh
        run: |
          node --version
          python --version
          uv --version

      - name: Checkout Upstream Source (lfnovo/open-notebook)
        uses: actions/checkout@v5
        with:
          repository: lfnovo/open-notebook
          ref: a0f6f3081ae06328f0a451b3a3ef2959ca25721d
          path: open-notebook

      - name: Validate Upstream Checkout
        shell: pwsh
        run: |
          $pyproject = Join-Path "${{ github.workspace }}" "open-notebook/pyproject.toml"
          if (-not (Test-Path -LiteralPath $pyproject -PathType Leaf)) {
            Write-Error "Upstream checkout is incomplete: pyproject.toml not found at $pyproject"
            exit 1
          }
          Write-Host "Found upstream pyproject.toml at $pyproject"

      - name: Verify Upstream Commit Matches Lock File
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath "upstream.lock.json" -Raw | ConvertFrom-Json).commit
          $actual = (git -C "${{ github.workspace }}/open-notebook" rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            Write-Error "Upstream commit mismatch: upstream.lock.json=$expected, checkout=$actual"
            exit 1
          }
          Write-Host "Verified upstream commit: $actual"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $makensis) {
            $resolved = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($resolved) { $makensis = $resolved.Source }
          }
          if (-not $makensis) {
            Write-Error "makensis.exe could not be located after installing NSIS"
            exit 1
          }
          Write-Host "Resolved makensis: $makensis"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MAKENSIS=$makensis"

      - name: Build Types
        run: npm run build:types

      - name: Prepare Runtime
        shell: pwsh
        run: |
          # F05 gate: packaging intentionally stops while the frontend is a POC.
          # Record that known outcome instead of failing the job; anything else
          # must still fail the step.
          $state = "failed"
          $output = node scripts/prepare-runtime.js --repo="${{ github.workspace }}/open-notebook" 2>&1 | Tee-Object -Variable allOutput
          $allOutput | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -eq 0) {
            $state = "passed"
          } elseif (($allOutput -join "`n") -match "Frontend is a proof of concept; functional application assembly remains open\." -and
                    ($allOutput -join "`n") -match "Preparation failed: Runtime assembly remains incomplete:") {
            Write-Host "::warning::Installer packaging stopped at the intentional F05 runtime-assembly gate (POC frontend). See docs/compliance/ferpa/RUNTIME_ASSEMBLY_HANDOFF.md."
            $state = "f05-gate"
          } else {
            exit 1
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PREPARE_RUNTIME_STATE=$state"

      - name: Package App (Native Tauri)
        run: npm run package:app

      - name: Build Native Installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:MAKENSIS -PathType Leaf)) {
            Write-Error "makensis.exe not found at $env:MAKENSIS"
            exit 1
          }
          node scripts/build-installer-native.js --makensis "$env:MAKENSIS"

      - name: Confirm Runtime Gate State
        shell: pwsh
        run: |
          # Fail the job if the Prepare Runtime step did not pass and the stop
          # was not the documented F05 POC-frontend gate.
          if ($env:PREPARE_RUNTIME_STATE -eq "passed") {
            Write-Host "Runtime preparation passed; packaging ran normally."
            exit 0
          }
          if ($env:PREPARE_RUNTIME_STATE -eq "f05-gate") {
            Write-Host "::warning::Expected state: the F05 runtime-assembly gate remains open until a functional frontend is delivered. No installer artifact is produced by design."
            exit 0
          }
          Write-Error "Prepare Runtime did not pass and did not stop at the documented F05 gate (state: '$($env:PREPARE_RUNTIME_STATE)')"
          exit 1

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "dist" -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            Write-Error "No installer .exe was produced in dist/"
            exit 1
          }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) {
              Write-Error "Installer is empty: $($installer.FullName)"
              exit 1
            }
            Write-Host "Installer verified: $($installer.FullName) ($($installer.Length) bytes)"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Office-Equity-Open-Notebook-Installer
          path: dist/*.exe
          if-no-files-found: error
