[package]
name = "office-equity-host-tauri"
version = "1.0.0"
description = "Production native desktop host and reverse proxy"
authors = ["Office of Equity"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog-message"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.29"
reqwest = { version = "0.11", features = ["blocking", "json", "stream"] }
hyper = { version = "0.14", features = ["full"] }
mime_guess = "2.0"
bytes = "1.0"
futures-util = "0.3"
dirs = "5.0"
winapi = { version = "0.3.9", features = ["jobapi2", "processthreadsapi", "handleapi", "minwindef"] }
chrono = "0.4"
